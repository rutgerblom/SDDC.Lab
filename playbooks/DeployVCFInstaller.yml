##    Authors: Luis Chanu & Rutger Blom
##   Filename: playbooks/DeployVCFInstaller.yml
##
---
- name: DeployVCFInstaller.yml
  hosts: localhost
  tasks:
    - name: DeployVCFInstaller_Playbook
      ansible.builtin.debug:
        msg: "Starting playbook: {{ ansible_play_name }}"

    - name: Display error message if Pod-XXX-Config file is not valid or provided
      ansible.builtin.pause:
        seconds: 5
        prompt: |
          *****************************************************************************************************
          ****************************************** ERROR MESSAGE ********************************************
          *****************************************************************************************************

            A valid "Pod-XXX-Config.yml" file is required in order for this playbook to run.

            Please verify:
            ==============
              1) You supplied a valid Pod-XXX-Config.yml file via the ansible-playbook -e "@Pod-XXX-Config.yml"
                 command-line option.  Here is an example of a how to load a Pod-XXX-Config.yml file that is
                 located in your home directory:
                                    ansible-playbook -e "@~/Pod-XXX-Config.yml" Deploy.yml

              2) The Pod-XXX-Config.yml file provided was created using the playbooks/CreatePodConfig.yml script.
                 All Pod configuration files used to deploy labs MUST be generated using that script.

              3) You included the proper path with the "-e" option to the Pod-XXX-Config.yml file.

              4) You prefaced the file name in the "-e" option with a '@', as shown in the example above.

          *****************************************************************************************************
      when:
        - Valid_Pod_Config_File is not defined

    - name: Exit Ansible playbook if Pod-XXX-Config.yml file is not valid or provided
      ansible.builtin.meta: end_play
      when: Valid_Pod_Config_File is not defined

    - name: DEBUG -- Display Target Variables (Pause)
      ansible.builtin.pause:
        seconds: "{{ DEBUG.DisplayDelayInSeconds }}"
        prompt: |
          ================================ Display Variables For Pod {{ '%03d' | format(Pod.Number | int) }} ==================================

                                     Ansible Playbook: {{ ansible_play_name }}

                                    Target.Deployment: {{ Target.Deployment }}

                                          Target.FQDN: {{ Target.FQDN }}
                                          Target.User: {{ Target.User }}
                                      Target.Password: {{ Target.Password }}
                                       Target.Cluster: {{ Target.Cluster }}
                                    Target.DataCenter: {{ Target.DataCenter }}
                                     Target.Datastore: {{ Target.Datastore }}
                                      Target.VMFolder: {{ Target.VMFolder }}

                                          VCFInstaller Version: {{ Deploy.Software.VCFInstaller.Version }}
                                  VCFInstaller FQDN: {{ Nested_VCFInstaller.Component.Appliance.FQDN }}
                                VCFInstaller VMName: {{ Nested_VCFInstaller.Component.Appliance.VMName }}
                                       VCFInstaller root User: {{ Nested_VCFInstaller.Credential.root.Name }}
                                   VCFInstaller root Password: {{ Nested_VCFInstaller.Credential.root.Password }}
                                      VCFInstaller admin User: {{ Nested_VCFInstaller.Credential.admin.Name }}
                                  VCFInstaller admin Password: {{ Nested_VCFInstaller.Credential.admin.Password }}
                                      VCFInstaller local User: {{ Nested_VCFInstaller.Credential.local.Name }}
                                  VCFInstaller local Password: {{ Nested_VCFInstaller.Credential.local.Password }}
                                     VCFInstaller backup User: {{ Nested_VCFInstaller.Credential.backup.Name }}
                                 VCFInstaller backup Password: {{ Nested_VCFInstaller.Credential.backup.Password }}
                                        VCFInstaller vcf User: {{ Nested_VCFInstaller.Credential.vcf.Name }}
                                    VCFInstaller vcf Password: {{ Nested_VCFInstaller.Credential.vcf.Password }}

                                                OVF Variables
                                                =============

                                    Network PortGroup: {{ Target.PortGroup.Management.Name }}

                                 Network IPv4 Address: {{ Nested_VCFInstaller.Component.Appliance.Address.IPv4.Address }}
                                      Network Netmask: {{ (Nested_VCFInstaller.Component.Appliance.Address.IPv4.Address + '/' +
                                                       Nested_VCFInstaller.Component.Appliance.Address.IPv4.Prefix) | ansible.utils.ipaddr('netmask') }}
                                      Network Gateway: {{ Nested_VCFInstaller.Component.Appliance.Address.IPv4.Gateway }}

                                   Network DNS Server: {{ Common.DNS.Server1.IPv4 }}
                                   Network DNS Domain: {{ Common.DNS.Domain }}

                                    VCFInstaller Root Password: {{ Nested_VCFInstaller.Credential.root.Password }}
                                   VCFInstaller admin Password: {{ Nested_VCFInstaller.Credential.admin.Password }}
                                   VCFInstaller local Password: {{ Nested_VCFInstaller.Credential.local.Password }}
                                  VCFInstaller backup Password: {{ Nested_VCFInstaller.Credential.backup.Password }}
                                     VCFInstaller vcf Password: {{ Nested_VCFInstaller.Credential.vcf.Password }}
                                      VCFInstaller FIPS_Enable: {{ Nested_VCFInstaller.Component.Appliance.FIPSEnable }}

                                       VCFInstaller Media Path: {{ Deploy.Software.VCFInstaller.Directory }}
                                       VCFInstaller Media File: {{ Deploy.Software.VCFInstaller.File }}

          =================================================================================================
      when:
        - DEBUG.DisplayVariables

    - name: Check if VCFInstaller is already installed
      ansible.builtin.uri:
        url: https://{{ Nested_VCFInstaller.Component.Appliance.FQDN }}
        validate_certs: "{{ Common.PKI.ValidateCerts }}"
        timeout: 5
      register: sddcmgr_check
      ignore_errors: true
      when:
        - Deploy.Product.VCFInstaller.Deploy

    - name: Deploy VCFInstaller from OVA
      community.vmware.vmware_deploy_ovf:
        hostname: "{{ Target.FQDN }}"
        username: "{{ Target.User }}"
        password: "{{ Target.Password }}"
        validate_certs: "{{ Common.PKI.ValidateCerts }}"
        datastore: "{{ Target.Datastore }}"
        allow_duplicates: false
        # For vCenter deployment, VM Folder path must be the FULL path: /<DataCenter>/vm/<ParentFolder>/<ChildFolder>
        folder: "{% if Target.Deployment == 'vCenter' %}/{{ Target.DataCenter }}/vm/{{ Target.VMFolder }}\
                 {% else %}{{ Target.VMFolder }}{% endif %}"
        datacenter: "{{ Target.DataCenter }}"
        cluster: "{{ Target.Cluster }}"
        name: "{{ Nested_VCFInstaller.Component.Appliance.VMName }}"
        ovf: "{{ Deploy.Software.VCFInstaller.Directory }}/{{ Deploy.Software.VCFInstaller.File }}"
        networks:
          "Network 1": "{{ Target.PortGroup.Management.Name }}"
        disk_provisioning: "{{ Common.DiskProvisioning }}"
        power_on: true
        wait_for_ip_address: true
        inject_ovf_env: true
        properties:
          ROOT_PASSWORD: "{{ Nested_VCFInstaller.Credential.root.Password }}"
          LOCAL_USER_PASSWORD: "{{ Nested_VCFInstaller.Credential.local.Password }}"
          FIPS_ENABLE: "{{ Nested_VCFInstaller.Component.Appliance.FIPSEnable }}"
          vami.hostname: "{{ Nested_VCFInstaller.Component.Appliance.FQDN }}"
          guestinfo.ntp: "{{ Common.NTP.Server1.IPv4 }}"
          vami.ip0.SDDC-Manager: "{{ Nested_VCFInstaller.Component.Appliance.Address.IPv4.Address }}"
          vami.netmask0.SDDC-Manager: "{{ (Nested_VCFInstaller.Component.Appliance.Address.IPv4.Address + '/' +
                                      Nested_VCFInstaller.Component.Appliance.Address.IPv4.Prefix) | ansible.utils.ipaddr('netmask') }}"
          vami.gateway.SDDC-Manager: "{{ Nested_VCFInstaller.Component.Appliance.Address.IPv4.Gateway }}"
          vami.domain.SDDC-Manager: "{{ Common.DNS.Domain }}"
          vami.searchpath.SDDC-Manager: "{{ Common.DNS.Domain }}"
          vami.DNS.SDDC-Manager: "{{ Common.DNS.Server1.IPv4 }}"
      when:
        - Deploy.Product.VCFInstaller.Deploy
        - sddcmgr_check.status != 200

    - name: Write annotation on the VCFInstaller VM
      community.vmware.vmware_guest:
        hostname: "{{ Target.FQDN }}"
        username: "{{ Target.User }}"
        password: "{{ Target.Password }}"
        validate_certs: "{{ Common.PKI.ValidateCerts }}"
        cluster: "{{ Target.Cluster }}"
        datacenter: "{{ Target.DataCenter }}"
        folder: "{{ Target.VMFolder }}"
        name: "{{ Nested_VCFInstaller.Component.Appliance.VMName }}"
        annotation: |
                    {{ Common.Annotation }}
                    {{ Deploy.Software.VCFInstaller.Vendor }} {{ Deploy.Software.VCFInstaller.Product }} {{ Deploy.Software.VCFInstaller.Version }}
                    VCFInstaller root User: {{ Nested_VCFInstaller.Credential.root.Name }}
                    VCFInstaller root Password: {{ Nested_VCFInstaller.Credential.root.Password }}
                    VCFInstaller admin User: {{ Nested_VCFInstaller.Credential.admin.Name }}
                    VCFInstaller admin Password: {{ Nested_VCFInstaller.Credential.admin.Password }}
                    VCFInstaller local User: {{ Nested_VCFInstaller.Credential.local.Name }}
                    VCFInstaller local Password: {{ Nested_VCFInstaller.Credential.local.Password }}
                    VCFInstaller backup User: {{ Nested_VCFInstaller.Credential.backup.Name }}
                    VCFInstaller backup Password: {{ Nested_VCFInstaller.Credential.backup.Password }}
                    VCFInstaller vcf User: {{ Nested_VCFInstaller.Credential.vcf.Name }}
                    VCFInstaller vcf Password: {{ Nested_VCFInstaller.Credential.vcf.Password }}
      when:
        - Deploy.Product.VCFInstaller.Deploy
