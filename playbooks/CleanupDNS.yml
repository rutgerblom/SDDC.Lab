    - name: DEBUG -- Display IPv4 'A' records for DNS_Records (Only first IPv4 address)
      ansible.builtin.pause:
        seconds: 1
        prompt: |
          ============================ Display DNS_Records DNS "A" Records ================================

                                Deploy.Setting.UseDNS: {{ Deploy.Setting.UseDNS }}
                                    LOCAL_RecordState: {{ LOCAL_RecordState }}

                                           DNS Server: {{ Common.DNS.Server1.IPv4 }}
                                                 Zone: {{ Common.DNS.Domain }}
                                               Record: {{ item.Name }}
                                                Value: {{ item.Addresses | ansible.utils.ipv4 | ansible.utils.ipaddr('address') | first }}

          =================================================================================================
      loop: "{{ DNS_Records }}"
      when:
        - DEBUG.DisplayVariables_DNS
        - DEBUG.DisplayVariables
        - Deploy.Setting.UseDNS
        - Deploy.Setting.IPv4
        - item.Name      | default(None) is not none
        - item.Addresses | default(None) is not none
        - item.Addresses | ansible.utils.ipv4 | ansible.utils.ipaddr('address') | first | length > 0

    - name: IPv4 'A' records for DNS_Records (Only first IPv4 address)
      community.general.nsupdate:
        server: "{{ Common.DNS.Server1.IPv4 }}"
        type: A
        protocol: "{{ Common.DNS.Protocol }}"
        zone: "{{ Common.DNS.Domain }}"
        record: "{{ item.Name }}"
        value: "{{ item.Addresses | ansible.utils.ipv4 | ansible.utils.ipaddr('address') | first }}"
        state: "{{ LOCAL_RecordState }}"
      loop: "{{ DNS_Records }}"
      when:
        - Deploy.Setting.UseDNS
        - Deploy.Setting.IPv4
        - item.Name      | default(None) is not none
        - item.Addresses | default(None) is not none
        - item.Addresses | ansible.utils.ipv4 | ansible.utils.ipaddr('address') | first | length > 0

