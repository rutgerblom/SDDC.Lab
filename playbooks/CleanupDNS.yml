                                                 Zone: {{ ipv4_reverse_zone }}
                                               Record: {{ item.1 | ansible.utils.ipaddr('address') | ansible.utils.ipaddr('revdns') }}
                                                Value: {{ item.0.Name }}.{{ Common.DNS.Domain }}.

          =================================================================================================
      loop: "{{ DNS_Records | ansible.builtin.subelements('Addresses',skip_missing=true) }}"
      when:
        - DEBUG.DisplayVariables_DNS
        - DEBUG.DisplayVariables
        - Deploy.Setting.UseDNS
        - Deploy.Setting.IPv4
        - item.0.Name | default(None) is not none
        - item.1      | default(None) is not none
        - item.1      | ansible.utils.ipv4 | ansible.utils.ipaddr('address')

